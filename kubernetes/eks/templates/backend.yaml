apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opsflow
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "__BACKEND_IMAGE__"
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{configMapRef: {name: opsflow-config}}]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: opsflow-db-secret, key: DB_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: rds-ca, mountPath: /etc/rds-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: rds-ca
          configMap: {name: rds-ca}
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: backend}}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: opsflow
spec:
  type: ClusterIP
  selector: {app: backend}
  ports: [{name: http, port: 3000, targetPort: http}]

apiVersion: batch/v1
kind: Job
metadata:
  name: opsflow-create-app-role
  namespace: opsflow
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: psql
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          command: [psql]
          args: [-v, ON_ERROR_STOP=1, -f, /sql/create-app-role.sql]
          env:
            - name: PGHOST
              valueFrom: {configMapKeyRef: {name: opsflow-config, key: DB_HOST}}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: opsflow}
            - {name: PGUSER, value: opsflow_admin}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/rds-ca/global-bundle.pem}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: opsflow-rds-bootstrap, key: password}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: opsflow-db-secret, key: DB_PASSWORD}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
            - {name: ca, mountPath: /etc/rds-ca, readOnly: true}
      volumes:
        - name: sql
          configMap: {name: opsflow-app-role-sql}
        - name: ca
          configMap: {name: rds-ca}


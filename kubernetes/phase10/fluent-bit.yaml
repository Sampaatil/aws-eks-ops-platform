apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsflow-fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase10-log-metadata
  namespace: opsflow
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase10-log-metadata
  namespace: opsflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase10-log-metadata
subjects:
  - kind: ServiceAccount
    name: opsflow-fluent-bit
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opsflow-fluent-bit
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Parsers_File              /fluent-bit/parsers/parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        storage.path              /buffers/storage
        storage.sync              normal
        storage.backlog.mem_limit 10M
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/backend-*_opsflow_backend-*.log,/var/log/containers/frontend-*_opsflow_frontend-*.log
        multiline.parser  docker, cri
        DB                /buffers/tail.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Read_from_Head    Off
        Refresh_Interval  5
        storage.type      filesystem
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        Labels              Off
        Annotations         Off
    [OUTPUT]
        Name                     cloudwatch_logs
        Match                    kube.*
        region                   ap-south-1
        log_group_name           /opsflow/opsflow-lab/application
        log_stream_prefix        opsflow-
        auto_create_group        false
        auto_retry_requests      true
        Retry_Limit              False
        storage.total_limit_size 100M
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: opsflow-fluent-bit
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: opsflow-fluent-bit}
  template:
    metadata:
      labels: {app: opsflow-fluent-bit}
    spec:
      serviceAccountName: opsflow-fluent-bit
      nodeSelector: {kubernetes.io/os: linux}
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:3.2.1
          command: ["/fluent-bit/bin/fluent-bit"]
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          env:
            - {name: AWS_REGION, value: ap-south-1}
            - {name: AWS_DEFAULT_REGION, value: ap-south-1}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
          ports:
            - {name: http, containerPort: 2020}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /api/v1/metrics, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/metrics, port: http}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true}
            - {name: logs, mountPath: /var/log, readOnly: true}
            - {name: buffers, mountPath: /buffers}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: opsflow-fluent-bit}
        - name: logs
          hostPath: {path: /var/log, type: Directory}
        - name: buffers
          hostPath: {path: /var/lib/opsflow-phase10-fluent-bit, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}

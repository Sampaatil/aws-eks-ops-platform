apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: opsflow

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:

    matchLabels:
      app: backend

  template:

    metadata:

      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: opsflow-backend:v2

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 3000

          envFrom:

            - configMapRef:
                name: opsflow-config

          env:

            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:
                  name: opsflow-db-secret
                  key: POSTGRES_PASSWORD

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:

            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001

            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

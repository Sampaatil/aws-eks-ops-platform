apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: opsflow

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:

    matchLabels:
      app: frontend

  template:

    metadata:

      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: opsflow-frontend:v1

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 8080

          resources:

            requests:
              cpu: "50m"
              memory: "32Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:

            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:

        - name: nginx-config
          configMap:
            name: frontend-nginx-config 